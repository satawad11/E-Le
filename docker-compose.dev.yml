# ชุดเสริมสำหรับการพัฒนาเท่านั้น — ห้ามใช้บน production
#
# DEPLOY-006 — Vite dev server ไม่มี authentication เสิร์ฟ source ดิบทั้งโครงการ
# และเปิด websocket HMR จึงต้องอยู่นอก `docker-compose.yml` ที่ใช้ deploy จริง
#
# วิธีใช้บนเครื่องพัฒนา:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# ผูกพอร์ตไว้ที่ 127.0.0.1 เท่านั้น จึงเข้าถึงได้จากเครื่องตัวเอง ไม่ใช่ทั้งวง LAN

services:
  # ให้เทสต์ที่ตรวจ "ทั้งโครงการ" ทำงานจริงบนเครื่องพัฒนา แทนที่จะ skip เงียบ ๆ
  #
  # ที่มา (2026-09-05): เทสต์แปดข้อที่ตรวจสัญญาข้ามฝั่ง — API ที่หน้าเว็บไม่มีใคร
  # เรียก · เวอร์ชัน dependency ที่ยัง pin ไม่ตายตัว · compose ที่เปิด dev server
  # บน production · เมนูที่ไม่มีหน้าจอ — **ข้ามทุกครั้งบนเครื่องพัฒนา** เพราะ
  # container ของ backend mount แค่ `backend/` เท่านั้น
  #
  # ผลคือข้อบกพร่องสองข้อถูกพบครั้งแรกตอนมีคนรันด้วย container ชั่วคราวที่ mount
  # ทั้ง repo เอง · **ด่านที่มีอยู่แล้วแต่ไม่เคยทำงาน คือด่านที่ไม่มี**
  #
  # อยู่ในไฟล์ dev **โดยเจตนา** — production ไม่ควรมี source ของหน้าเว็บและไฟล์
  # CI อยู่ใน container ของ backend · mount แบบอ่านอย่างเดียวทั้งหมด
  backend:
    volumes:
      - ./frontend:/var/www/frontend:ro
      - ./.github:/var/www/.github:ro
      - ./docker-compose.yml:/var/www/docker-compose.yml:ro
      - ./docker-compose.dev.yml:/var/www/docker-compose.dev.yml:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eleave_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: >
      sh -c "npm ci &&
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
