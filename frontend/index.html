<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Leave</title>
  </head>
  <body>
    <div id="app">
      <div class="app-startup" role="status" aria-live="polite">
        <div class="app-startup__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div class="app-startup__spinner" aria-hidden="true"></div>
        <strong>กำลังเตรียมระบบ E-Leave</strong>
        <span>กรุณารอสักครู่...</span>
      </div>
    </div>
    <style>
      html, body, #app { min-height: 100%; margin: 0; }
      body { background: #f9fafb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .app-startup {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #374151;
      }
      .app-startup__logo {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: white;
        background: #800000;
        box-shadow: 0 10px 25px rgba(128, 0, 0, .18);
      }
      .app-startup__logo svg { width: 30px; height: 30px; }
      .app-startup__spinner {
        width: 28px;
        height: 28px;
        margin-top: 8px;
        border: 3px solid #e5e7eb;
        border-top-color: #800000;
        border-radius: 9999px;
        animation: app-startup-spin .75s linear infinite;
      }
      .app-startup strong { color: #111827; font-size: 16px; }
      .app-startup span { color: #6b7280; font-size: 14px; }
      @keyframes app-startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .app-startup__spinner { animation-duration: 1.5s; }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
