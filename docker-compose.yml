x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: mysql:8.0
    container_name: eleave_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: eleave
      # รหัสผ่านมาจาก .env ที่ root ของโปรเจกต์ (gitignore) — ห้าม hardcode ที่นี่
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ต้องตั้งค่าใน .env}
      #
      # DEPLOY-007 — บัญชีฐานข้อมูลของแอปต้องถูกสร้างโดย stack เอง
      #
      # เดิม compose ส่ง DB_APP_USERNAME/DB_APP_PASSWORD ให้ backend อย่างเดียว
      # แต่**ไม่มีอะไรสร้างบัญชีนั้นใน MySQL เลย** stack ที่ขึ้นจากศูนย์จึงมีแต่ root
      # แล้ว backend วนรีสตาร์ตด้วย "Access denied for user" ตลอดไป — ที่ผ่านมาใช้ได้
      # เพราะมีคนสร้างบัญชีด้วยมือไว้ครั้งหนึ่ง พอ volume ถูกสร้างใหม่ก็หายไปพร้อมกัน
      #
      # image ของ MySQL สร้างบัญชีนี้ให้เองและ GRANT ALL บน MYSQL_DATABASE
      # (ทำงานเฉพาะตอน initialize volume ครั้งแรกเท่านั้น)
      MYSQL_USER: ${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - eleave_mysql_data:/var/lib/mysql
    command: --skip-name-resolve
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5m

  #
  # SEC-GAP-02 (INT-04) — ด่านตรวจไวรัสของไฟล์ที่ผู้ใช้อัปโหลด
  #
  # ระเบียบงานสารบรรณกำหนดให้ไฟล์แนบต้องผ่านการตรวจก่อนเก็บ (SoT §26) และเดิม
  # ระบบตรวจแค่ชนิดไฟล์กับขนาดเท่านั้น — PDF ที่ฝัง payload ไว้จึงผ่านได้ทุกด่าน
  #
  # ไม่เปิด port ออกนอกเครื่อง เข้าถึงได้เฉพาะ service ใน network เดียวกัน
  # `start_period` ยาวเพราะรอบแรกต้องดาวน์โหลดฐานลายเซ็นไวรัสหลายร้อยเมกะไบต์
  # เก็บฐานลายเซ็นไว้ใน volume เพื่อไม่ต้องโหลดใหม่ทุกครั้งที่รีสตาร์ต
  #
  clamav:
    image: clamav/clamav:1.5-debian13-slim
    container_name: eleave_clamav
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3310"
    volumes:
      - eleave_clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  backend:
    image: e-le-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eleave_backend
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      # php.ini มีอยู่ใน repo มานานแต่ไม่เคยถูก mount — ค่าที่ตั้งไว้จึงไม่เคยมีผล
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    # ไม่เปิด port ออกนอก — ทางเข้าเดียวของระบบคือ nginx (DEPLOY-001)
    expose:
      - "9000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
      - SESSION_ENCRYPT=${SESSION_ENCRYPT:-true}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - SANCTUM_EXPIRATION=${SANCTUM_EXPIRATION:-480}
      - MODULE_LEAVE_ENABLED=${MODULE_LEAVE_ENABLED:-true}
      - MODULE_ATTENDANCE_ENABLED=${MODULE_ATTENDANCE_ENABLED:-true}
      - MODULE_OVERTIME_ENABLED=${MODULE_OVERTIME_ENABLED:-true}
      - MODULE_SARABAN_ENABLED=${MODULE_SARABAN_ENABLED:-true}
      - MODULE_NOTIFICATION_ENABLED=${MODULE_NOTIFICATION_ENABLED:-true}
      - MODULE_REPORTING_ENABLED=${MODULE_REPORTING_ENABLED:-true}
      # SEC-GAP-02 — ปลายทางของด่านตรวจไวรัส (ดู service `clamav`)
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - UPLOAD_MALWARE_SCAN=${UPLOAD_MALWARE_SCAN:-true}
    # `exec php-fpm` เพื่อให้ php-fpm เป็น PID 1 และรับสัญญาณ stop/restart ได้ตรง ๆ
    #
    # SEC-022 — `app:verify-environment` เป็นคำสั่งแรกเสมอ ถ้าค่า APP_ENV/APP_DEBUG
    # (หรือ APP_KEY/APP_URL/serve ของ disk local) ไม่ปลอดภัย คำสั่งนี้คืน exit code 1
    # คำสั่งถัดไปจึงไม่ถูกรัน และ container ออกโดยไม่เริ่มให้บริการเลย
    command: >
      bash -c "if [ ! -f vendor/autoload.php ]; then composer install --ignore-platform-reqs; fi;
               php artisan app:verify-environment &&
               php artisan migrate --force &&
               php artisan optimize:clear &&
               exec php-fpm"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      # `service_started` ไม่ใช่ `service_healthy` โดยเจตนา — รอบแรก clamav ใช้เวลา
      # ดาวน์โหลดฐานลายเซ็นหลายนาที ถ้าผูกกับ healthy ทั้งระบบจะใช้งานไม่ได้เลย
      # ระหว่างนั้น · แทนที่จะปิดทั้งระบบ ให้เฉพาะ "การอัปโหลดไฟล์" ที่ล้มไปก่อน
      # พร้อมข้อความบอกเหตุ (fail closed เฉพาะจุด ไม่ใช่ปล่อยผ่านเงียบ ๆ)
      clamav:
        condition: service_started

  # ทางเข้าเดียวของ stack — production-grade web server (DEPLOY-001)
  # เดิม backend เสิร์ฟด้วย `php artisan serve` ซึ่งเป็น dev server แบบ single-threaded
  # และ config nginx ที่มีอยู่ไม่เคยถูกใช้เลย (DEPLOY-004)
  nginx:
    image: nginx:1.27-alpine
    container_name: eleave_nginx
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      backend:
        condition: service_started

  worker:
    image: e-le-backend
    container_name: eleave_worker
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      # php.ini มีอยู่ใน repo มานานแต่ไม่เคยถูก mount — ค่าที่ตั้งไว้จึงไม่เคยมีผล
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
      - MODULE_LEAVE_ENABLED=${MODULE_LEAVE_ENABLED:-true}
      - MODULE_ATTENDANCE_ENABLED=${MODULE_ATTENDANCE_ENABLED:-true}
      - MODULE_OVERTIME_ENABLED=${MODULE_OVERTIME_ENABLED:-true}
      - MODULE_SARABAN_ENABLED=${MODULE_SARABAN_ENABLED:-true}
      - MODULE_NOTIFICATION_ENABLED=${MODULE_NOTIFICATION_ENABLED:-true}
      - MODULE_REPORTING_ENABLED=${MODULE_REPORTING_ENABLED:-true}
      # SEC-GAP-02 — ปลายทางของด่านตรวจไวรัส (ดู service `clamav`)
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - UPLOAD_MALWARE_SCAN=${UPLOAD_MALWARE_SCAN:-true}
    command: >
      bash -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
               php artisan app:verify-environment &&
               exec php artisan queue:work --sleep=3 --tries=3 --timeout=120"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend:
        condition: service_started
      clamav:
        condition: service_started

  scheduler:
    image: e-le-backend
    container_name: eleave_scheduler
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      # php.ini มีอยู่ใน repo มานานแต่ไม่เคยถูก mount — ค่าที่ตั้งไว้จึงไม่เคยมีผล
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
      - MODULE_LEAVE_ENABLED=${MODULE_LEAVE_ENABLED:-true}
      - MODULE_ATTENDANCE_ENABLED=${MODULE_ATTENDANCE_ENABLED:-true}
      - MODULE_OVERTIME_ENABLED=${MODULE_OVERTIME_ENABLED:-true}
      - MODULE_SARABAN_ENABLED=${MODULE_SARABAN_ENABLED:-true}
      - MODULE_NOTIFICATION_ENABLED=${MODULE_NOTIFICATION_ENABLED:-true}
      - MODULE_REPORTING_ENABLED=${MODULE_REPORTING_ENABLED:-true}
      # SEC-GAP-02 — ปลายทางของด่านตรวจไวรัส (ดู service `clamav`)
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - UPLOAD_MALWARE_SCAN=${UPLOAD_MALWARE_SCAN:-true}
    command: >
      bash -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
               php artisan app:verify-environment &&
               exec php artisan schedule:work"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend:
        condition: service_started

  # DEPLOY-006 — สร้างไฟล์หน้าเว็บสำหรับ production
  #
  # เดิมไฟล์นี้มี service `frontend` ที่รัน `npm run dev -- --host 0.0.0.0`
  # และ publish พอร์ต 5173 ออกทุกอินเทอร์เฟซ ซึ่งเป็น **dev server ของ Vite**
  # ที่ไม่มี authentication, เสิร์ฟ source map และ module ดิบทั้งโครงการ,
  # เปิด websocket HMR ให้เชื่อมจากภายนอก และมีทางเข้าอ่านไฟล์ในโปรเจกต์
  # ทั้งที่ compose ชุดนี้คือชุดเดียวกับที่เอกสาร deploy สั่งให้ใช้บน production
  #
  # ชุดนี้เหลือเฉพาะ job สร้าง `frontend/dist` ที่ nginx เสิร์ฟ (mount แบบ read-only)
  # แล้วจบการทำงาน ไม่มีพอร์ตเปิดออก
  # dev server ย้ายไป `docker-compose.dev.yml` ซึ่งต้องสั่งใช้อย่างชัดเจน
  #
  #   docker compose --profile build run --rm frontend_build
  frontend_build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eleave_frontend_build
    profiles: ["build"]
    restart: "no"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run build"

volumes:
  frontend_node_modules:
  eleave_mysql_data:
  backend_vendor:
  eleave_clamav_db:
