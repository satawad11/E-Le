services:
  db:
    image: mysql:8.0
    container_name: eleave_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eleave
      # รหัสผ่านมาจาก .env ที่ root ของโปรเจกต์ (gitignore) — ห้าม hardcode ที่นี่
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ต้องตั้งค่าใน .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - eleave_mysql_data:/var/lib/mysql
    command: --skip-name-resolve
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5m

  backend:
    image: e-le-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eleave_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
      - PHP_CLI_SERVER_WORKERS=4
    command: >
      bash -c "if [ ! -f vendor/autoload.php ]; then composer install --ignore-platform-reqs; fi;
               php artisan migrate --force &&
               php artisan optimize:clear &&
               php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    depends_on:
      db:
        condition: service_healthy
        restart: true

  worker:
    image: e-le-backend
    container_name: eleave_worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
    command: >
      bash -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
               exec php artisan queue:work --sleep=3 --tries=3 --timeout=120"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend:
        condition: service_started

  scheduler:
    image: e-le-backend
    container_name: eleave_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=eleave
      - DB_USERNAME=${DB_APP_USERNAME:?ต้องตั้งค่าใน .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?ต้องตั้งค่าใน .env}
      - LOG_CHANNEL=structured
    command: >
      bash -c "until [ -f vendor/autoload.php ]; do sleep 2; done;
               exec php artisan schedule:work"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eleave_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm ci && 
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  eleave_mysql_data:
  backend_vendor:
