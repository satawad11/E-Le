# CORE CHECKPOINT · DEPLOY-001 / DEPLOY-004
#
# ก่อนหน้านี้ไฟล์นี้เป็น dead config — compose รัน `php artisan serve` แทน
# กฎความปลอดภัยด้านล่าง โดยเฉพาะ `location ^~ /storage { return 404; }`
# จึงไม่เคยมีผลบังคับใช้จริง ทั้งที่เป็นด่านสุดท้ายของช่องโหว่ไฟล์สาธารณะ (SEC-001)
#
# ตอนนี้ nginx เป็นทางเข้าเดียวของ stack และ config นี้ถูกใช้งานจริง

upstream php_backend {
    server backend:9000;
}

server {
    listen 80;
    server_name _;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # public/ ของ Laravel — ต้องตรงกับ bind mount ใน docker-compose.yml
    root /var/www/html/public;

    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # ไฟล์ที่ผู้ใช้อัปโหลดเป็นข้อมูลส่วนบุคคล ต้องออกทาง API ที่ตรวจสิทธิ์เท่านั้น
    # `^~` กันไม่ให้ location ของ PHP ด้านล่างรับเส้นทางนี้ไปเสิร์ฟ
    location ^~ /storage {
        return 404;
    }

    # Backend API
    location ~ ^/(api|sanctum) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    # หน้าเว็บ (ผลลัพธ์ของ `npm run build`) — SPA fallback
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;

        # index.html ต้องไม่ถูก cache มิฉะนั้นผู้ใช้ค้างอยู่กับ bundle เก่าหลัง deploy
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }
    }
}
