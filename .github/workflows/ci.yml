name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eleave_test
          MYSQL_USER: eleave_test
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ueleave_test -ptest_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eleave_test
      DB_USERNAME: eleave_test
      DB_PASSWORD: test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip
          # เปิด pcov เพื่อวัด coverage (เร็วกว่า xdebug) — ดูขั้น "Tests" ด้านล่าง
          coverage: pcov
          # ตั้ง memory_limit ให้ตรงกับที่ image ใช้ (backend/Dockerfile, docker/php/php.ini)
          # เทสต์อัปโหลดรูปเพดาน 5 MB (base64) กินหน่วยความจำเกิน default 128M จน OOM
          ini-values: memory_limit=256M
      # INT-18 — การปกปิดข้อมูลต้องแปลงเอกสารเป็นภาพเพื่อลบชั้นข้อความจริง
      #
      # กล่องดำทับข้อความไม่ใช่การปกปิด — ข้อความยังคัดลอกออกมาได้
      # ถ้าไม่มี ghostscript เทสต์ 3 ข้อจะ skip แทนที่จะยืนยันว่าปกปิดได้จริง
      # ซึ่งเท่ากับ CI ผ่านโดยไม่ได้ตรวจสิ่งที่สำคัญที่สุดของ INT-18
      - name: Install ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      # SEC-020 — advisory ของ dependency ฝั่ง PHP ต้องเป็นศูนย์เช่นกัน
      - name: Audit dependencies
        run: composer audit
      - name: Pint
        run: vendor/bin/pint --test
      # Static analysis — Pint ตรวจแค่ style ส่วน PHPStan/Larastan จับ type/null/
      # เมธอดที่ไม่มีจริง · หนี้เดิม freeze ไว้ใน phpstan-baseline.neon โค้ดใหม่ต้องสะอาด
      - name: PHPStan (Larastan)
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
      - name: Migrate from empty MySQL 8 database
        run: php artisan migrate --force
      # Document Engine เรนเดอร์แบบฟอร์ม PDF ด้วยฟอนต์ไทยที่สร้างจาก TTF ในโครงการ
      # ถ้าไม่ติดตั้ง เทสต์ที่เรนเดอร์เอกสารจะล้มด้วยข้อความ "ยังไม่ได้ติดตั้งฟอนต์ไทย"
      - name: Install document engine Thai fonts
        run: php artisan document:install-fonts
      # รันเทสต์พร้อมวัด coverage — เรียก phpunit ตรง ๆ ในโปรเซสเดียว และยก
      # memory_limit เฉพาะคำสั่งนี้ เพราะการ "รวมรายงาน coverage" ใช้หน่วยความจำ
      # เกินค่า runtime 256M (`php artisan test` spawn child ที่อ่าน php.ini 256M
      # จึง OOM ตอนสร้างรายงาน) · ค่า default ของระบบยังเป็น 256M ตามเดิม
      # (ดู ConfigDriftTest) · ยังไม่ตั้ง --min เป็นด่านบังคับ เมื่อทีมเห็นตัวเลข
      # แล้วค่อยเพิ่มใน phpunit.xml เพื่อ ratchet ขึ้นทีละขั้น
      - name: Tests (with coverage)
        run: php -d memory_limit=-1 vendor/bin/phpunit --coverage-text

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # QUALITY-002/003/004 — เดิม job นี้มีแต่ `npm run build`
      # โค้ดที่ import ไม่ครบหรือมี syntax ผิดในไฟล์ที่ build ยังผ่านจึงหลุดขึ้นระบบได้
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      # advisory ของ dependency ต้องเป็นศูนย์ ไม่ปล่อยให้สะสม
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npm run build
      # SEC-027 — บัญชีทดสอบ (อีเมล + รหัสผ่าน ของบัญชี seed รวมถึง Super Admin)
      # ต้องไม่ถูก build ติดไปกับหน้าเว็บ production
      - name: Assert no seeded credentials in the production bundle
        run: |
          if grep -rlE 'superadmin@example\.com|1111111111111' dist/; then
            echo "พบบัญชีทดสอบใน bundle ของ production" >&2
            exit 1
          fi
